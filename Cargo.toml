[package]
name = "naga"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
indexmap = "2.14.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
ryu-js = "1.0.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros"] }
unicode-general-category = "1.1.0"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[workspace]
members = [".", "editor"]
